services:
  - type: web
    name: synthra-ai
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm --workspace server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
